# Copy to ~/.config/lyra/config.toml
url = "http://localhost:11434/v1"   # any OpenAI-compatible endpoint
model = "llama3.2"

# Cost tracking: price per million tokens (leave at 0 for a free local model).
input_cost_per_mtok = 0.0
cached_input_cost_per_mtok = 0.0    # prompt tokens served from cache; defaults to the input price
output_cost_per_mtok = 0.0
currency = "$"
