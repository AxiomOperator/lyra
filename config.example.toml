# Copy to ~/.lyra/config/config.toml
url = "http://localhost:11434/v1"   # any OpenAI-compatible endpoint
model = "llama3.2"

# Cost tracking: price per million tokens (leave at 0 for a free local model).
input_cost_per_mtok = 0.0
cached_input_cost_per_mtok = 0.0    # prompt tokens served from cache; defaults to the input price
output_cost_per_mtok = 0.0
currency = "$"

# Embedding and reranker models (optional). Not used by the chat yet; lyra
# checks they respond at startup and on Ctrl-L.
# [embedding]
# url = "http://localhost:8082/v1"
# model = "embedding"
#
# [reranker]
# url = "http://localhost:8081/v1"
# model = "reranker"

# Persistent memory (on by default). The model gets memory_remember / recall /
# forget / list tools; needs a server with tool calling (llama.cpp: --jinja).
# [memory]
# enabled = true
# path = "~/.lyra/memory/memory.db"            # default
# default_scope = "user"                        # scope when the model doesn't pick one

# Self-learning skills (see README): reviews after corrections and multi-step
# work create or refine skills; outcomes and evidence drive their lifecycle.
# Skills are Markdown files in dir; their history is in dir/ledger.db.
# [learning]
# mode = "propose"          # off | propose (changes wait for /approve) | auto
# curate = "manual"         # manual | daily | weekly
# dir = "~/.lyra/skills"    # default
# min_confidence = 0.6      # drop lessons the reviewer is less sure of
# max_skills = 3            # skills added to the prompt per message
#
# [learning.scoring]        # how skills are ranked for a message
# relevance = 0.50
# reliability = 0.25
# confidence = 0.15
# freshness = 0.10
# half_life_days = 90
#
# [learning.lifecycle]      # evidence needed to promote or deprecate
# promote_confidence = 0.85
# promote_successes = 2
# deprecate_reliability = 0.4
# deprecate_min_uses = 5
# stale_days = 90
