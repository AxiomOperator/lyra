# Copy to ~/.lyra/config/config.toml
url = "http://localhost:11434/v1"   # any OpenAI-compatible endpoint
model = "llama3.2"

# lyra's internal JSON calls (planning, verification, memory capture, skill
# reviews, curation): cap their tokens, and optionally skip the model's thinking
# for them (much faster with reasoning models on llama.cpp / vLLM).
# structured_max_tokens = 8192
# structured_thinking = true

# Cost tracking: price per million tokens (leave at 0 for a free local model).
input_cost_per_mtok = 0.0
cached_input_cost_per_mtok = 0.0    # prompt tokens served from cache; defaults to the input price
output_cost_per_mtok = 0.0
currency = "$"

# Embedding and reranker models (optional). Not used by the chat yet; lyra
# checks they respond at startup and on Ctrl-L.
# [embedding]
# url = "http://localhost:8082/v1"
# model = "embedding"
#
# [reranker]
# url = "http://localhost:8081/v1"
# model = "reranker"

# Memory (see README): facts, episodes and working memory, with automatic
# capture, superseding, hybrid recall (keywords + [embedding] vectors) and a
# context compiler that adds the relevant few memories to each prompt.
# [memory]
# enabled = true
# path = "~/.lyra/memory/memory.db"   # default
# default_scope = "user"
# allowed_scopes = ["*"]              # e.g. ["user", "agent", "project:*"]
# capture = "auto"                    # auto | off
# maintenance = "propose"             # off | propose | auto
# curate = "manual"                   # manual | daily | weekly
# inject = true
# project = "auto"                    # auto (git checkout name) | none | a name
# same_wording = 0.85
# same_meaning = 0.95
# duplicate_wording = 0.6
# stale_days = 180
#
# [memory.context]
# max_tokens = 600
# max_memories = 8
# min_score = 0.35
# min_relevance = 0.45
#
# [memory.ranking]
# semantic = 0.40
# lexical = 0.20
# importance = 0.15
# confidence = 0.10
# recency = 0.10
# relationship = 0.05
#
# [memory.half_life_days]
# working = 1
# episodic = 30
# semantic = 365
# preference = 730
# decision = 365
# configuration = 90

# Plans (see README): /plan <request> makes a goal and a structured plan;
# /plan run executes it with verification, retries, replanning, approvals for
# destructive steps, budgets and checkpoints.
# [planning]
# enabled = true
# path = "~/.lyra/plans/plans.db"   # default
# max_parallel = 3
# forbidden_tools = []
#
# [planning.budget]
# max_model_calls = 40
# max_tool_calls = 100
# max_replans = 3
# max_minutes = 30
# max_tokens = 300000

# Self-learning skills (see README): reviews after corrections and multi-step
# work create or refine skills; outcomes and evidence drive their lifecycle.
# Skills are Markdown files in dir; their history is in dir/ledger.db.
# [learning]
# mode = "propose"          # off | propose (changes wait for /approve) | auto
# curate = "manual"         # manual | daily | weekly
# dir = "~/.lyra/skills"    # default
# min_confidence = 0.6      # drop lessons the reviewer is less sure of
# max_skills = 3            # skills added to the prompt per message
#
# [learning.scoring]        # how skills are ranked for a message
# relevance = 0.50
# reliability = 0.25
# confidence = 0.15
# freshness = 0.10
# half_life_days = 90
#
# [learning.lifecycle]      # evidence needed to promote or deprecate
# promote_confidence = 0.85
# promote_successes = 2
# deprecate_reliability = 0.4
# deprecate_min_uses = 5
# stale_days = 90

# Self-evolution (see README): runs are recorded; reviews find problems and
# propose small, reversible changes (guidelines, behavior settings, workflows,
# composite tools, skill revisions) that are benchmarked before deploying.
# Every deployment is a generation that can be rolled back.
# [evolution]
# enabled = true
# mode = "propose"          # off (record runs only) | propose | auto
# review = "manual"         # manual | daily | weekly
# window = 50               # recent runs the detectors look at
# benchmark_tasks = 3       # tasks replayed per benchmark
# monitor_runs = 10         # judged runs before generations are compared
# monitor_drop = 0.15       # success-rate drop that counts as a regression
# max_problems = 3          # problems a review proposes candidates for
# source_repo = "~/Projects/lyra"   # a lyra checkout: enables /evolve code
#                                   # (patches go to local evolution/<id> branches only)
#
# [evolution.thresholds]    # when something counts as a problem
# heavy_tool_calls = 8
# heavy_model_calls = 6
# heavy_runs = 2
# repeated_error = 3
# corrections = 3
# sequence_runs = 3
# replans = 2
# plan_retries = 3
# plan_verification_failures = 2
# plan_runs = 2
# skill_min_uses = 3
# skill_reliability = 0.4
#
# [evolution.fitness]       # benchmark weights
# success = 0.4
# accuracy = 0.25
# efficiency = 0.15
# reliability = 0.1
# safety = 0.1
