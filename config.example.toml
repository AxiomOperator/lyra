# Copy to ~/.lyra/config/config.toml
url = "http://localhost:11434/v1"   # any OpenAI-compatible endpoint
model = "llama3.2"
# vision = false   # true if the model reads images: photos sent from the app go to it

# lyra's internal JSON calls (planning, verification, memory capture, skill
# reviews, curation): cap their tokens, and optionally skip the model's thinking
# for them (much faster with reasoning models on llama.cpp / vLLM).
# structured_max_tokens = 8192
# structured_thinking = true

# Cost tracking: price per million tokens (leave at 0 for a free local model).
input_cost_per_mtok = 0.0
cached_input_cost_per_mtok = 0.0    # prompt tokens served from cache; defaults to the input price
output_cost_per_mtok = 0.0
currency = "$"

# Embedding and reranker models (optional). Not used by the chat yet; lyra
# checks they respond at startup and on Ctrl-L.
# [embedding]
# url = "http://localhost:8082/v1"
# model = "embedding"
#
# [reranker]
# url = "http://localhost:8081/v1"
# model = "reranker"

# A decision model (see README), e.g. clef-flash on llama-server's /v1/systemone:
# routing, memory links, step checks and per-turn gates in milliseconds. Leave it
# out and the chat model answers those questions, as before.
# [decide]
# url = "http://localhost:8091/v1"
# model = "clef-flash"
# min_confidence = 0.75
# max_state_chars = 1000   # raise with llama-server's -b/-ub (e.g. 20000 for -ub 8192)

# Memory (see README): facts, episodes and working memory, with automatic
# capture, superseding, hybrid recall (keywords + [embedding] vectors) and a
# context compiler that adds the relevant few memories to each prompt.
# [memory]
# enabled = true
# backend = "lance"                   # lance (LanceDB, default) | sqlite
# path = "~/.lyra/memory/lance"       # default: a directory for lance, memory.db for sqlite
# table = "memories"
# vector_index_threshold = 10000      # index vectors from this many on; 0 = never
# default_scope = "user"
# allowed_scopes = ["*"]              # e.g. ["user", "agent", "project:*"]
# capture = "auto"                    # auto | off
# maintenance = "propose"             # off | propose | auto
# curate = "manual"                   # manual | daily | weekly
# inject = true
# project = "auto"                    # auto (git checkout name) | none | a name
# same_wording = 0.85
# same_meaning = 0.95
# duplicate_wording = 0.6
# stale_days = 180
#
# [memory.context]
# max_tokens = 600
# max_memories = 8
# min_score = 0.35
# min_relevance = 0.45
#
# [memory.ranking]
# semantic = 0.40
# lexical = 0.20
# importance = 0.15
# confidence = 0.10
# recency = 0.10
# relationship = 0.05
#
# [memory.half_life_days]
# working = 1
# episodic = 30
# semantic = 365
# preference = 730
# decision = 365
# configuration = 90

# Plans (see README): /plan <request> makes a goal and a structured plan;
# /plan run executes it with verification, retries, replanning, approvals for
# destructive steps, budgets and checkpoints.
# [planning]
# enabled = true
# path = "~/.lyra/plans/plans.db"   # default
# max_parallel = 3
# forbidden_tools = []
#
# [planning.budget]
# max_model_calls = 40
# max_tool_calls = 100
# max_replans = 3
# max_minutes = 30
# max_tokens = 300000

# Self-learning skills (see README): reviews after corrections and multi-step
# work create or refine skills; outcomes and evidence drive their lifecycle.
# Skills are Markdown files in dir; their history is in dir/ledger.db.
# [learning]
# mode = "propose"          # off | propose (changes wait for /approve) | auto
# curate = "manual"         # manual | daily | weekly
# dir = "~/.lyra/skills"    # default
# min_confidence = 0.6      # drop lessons the reviewer is less sure of
# max_skills = 3            # skills added to the prompt per message
#
# [learning.scoring]        # how skills are ranked for a message
# relevance = 0.50
# reliability = 0.25
# confidence = 0.15
# freshness = 0.10
# half_life_days = 90
#
# [learning.lifecycle]      # evidence needed to promote or deprecate
# promote_confidence = 0.85
# promote_successes = 2
# deprecate_reliability = 0.4
# deprecate_min_uses = 5
# stale_days = 90

# Self-evolution (see README): runs are recorded; reviews find problems and
# propose small, reversible changes (guidelines, behavior settings, workflows,
# composite tools, skill revisions) that are benchmarked before deploying.
# Every deployment is a generation that can be rolled back.
# [evolution]
# enabled = true
# mode = "propose"          # off (record runs only) | propose | auto
# review = "manual"         # manual | daily | weekly
# window = 50               # recent runs the detectors look at
# benchmark_tasks = 3       # tasks replayed per benchmark
# monitor_runs = 10         # judged runs before generations are compared
# monitor_drop = 0.15       # success-rate drop that counts as a regression
# max_problems = 3          # problems a review proposes candidates for
# source_repo = "~/Projects/lyra"   # a lyra checkout: enables /evolve code
#                                   # (patches go to local evolution/<id> branches only)
#
# [evolution.thresholds]    # when something counts as a problem
# heavy_tool_calls = 8
# heavy_model_calls = 6
# heavy_runs = 2
# repeated_error = 3
# corrections = 3
# sequence_runs = 3
# replans = 2
# plan_retries = 3
# plan_verification_failures = 2
# plan_runs = 2
# skill_min_uses = 3
# skill_reliability = 0.4
# capability_min_uses = 5
# capability_success = 0.6
# capability_slow_ms = 15000
# goal_blocks = 3
# agent_min_delegations = 4
# agent_trouble_share = 0.4
#
# [evolution.fitness]       # benchmark weights
# success = 0.4
# accuracy = 0.25
# efficiency = 0.15
# reliability = 0.1
# safety = 0.1

# Capabilities (see README): everything lyra can do — memory tools, composite
# tools, OpenAPI operations, MCP tools, workflows, skills, helper agents —
# discovered per message, scored by track record, behind a policy.
# [capabilities]
# max_tools = 16            # offer all callable capabilities up to this many
# discovery_limit = 8       # otherwise this many per message, plus search
#
# [capabilities.policy]     # auto | approval | deny, per risk level
# read_only = "auto"
# low_write = "auto"
# write = "auto"
# destructive = "approval"
# privileged = "deny"
# overrides = { "pm.tasks.delete" = "deny" }
#
# [capabilities.scoring]
# relevance = 0.55
# reliability = 0.2
# permission = 0.1
# efficiency = 0.1
# history = 0.05
#
# [[capabilities.openapi]]
# name = "pm"
# spec = "~/.lyra/capabilities/pm.yaml"   # or a URL (fetched daily, cached)
# auth_env = "PM_TOKEN"     # the environment variable holding the credential
# # auth_secret = "pmi"     # or a token in config/secrets.toml
# # include_tags = ["tasks", "projects"]   exclude_tags = []   exclude = ["/v1/admin/*"]
# # defaults = { orgId = "…" }             # filled in, never asked of the model
# # approve_writes = true                  # changes ask first
#
# [[capabilities.mcp]]
# name = "fs"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/me/notes"]

# Goals (see README): long-lived goals worked through plans, with blockers,
# priorities, triggers and an autonomy policy the runtime enforces.
# [goals]
# tick_seconds = 60
# stale_days = 14
#
# [goals.autonomy]
# mode = "reactive"         # reactive | assisted | autonomous
# max_runtime_minutes = 30
# max_plans = 3
# max_tool_calls = 60
# max_model_calls = 40
# max_replans = 2
# max_cost = 0.0
# max_risk = "write"
# cooldown_minutes = 60
# max_failures = 3
#
# [goals.priority]
# explicit = 0.35
# deadline = 0.25
# dependency = 0.15
# importance = 0.1
# progress = 0.1
# cost = 0.05

# Specialist subagents (~/.lyra/agents/<name>.toml). /agent new creates one.
# [agents]
# enabled = true
# auto_delegate = true        # hand matching requests over without being asked
# max_depth = 2               # main → agent → agent, no further
# show_handled_by = true      # "handled with: Writer" under replies
#
# [agents.routing]
# rule_threshold = 0.75
# semantic_threshold = 0.85
# semantic_floor = 0.5
# model_fallback = true       # ask the model when routing is unsure
#
# [agents.budget]
# max_model_calls = 6         # per delegation
# max_tool_calls = 12

# System access (see README): shell, files, HTTP and servers over SSH, for the
# Operator agent only (the main agent hands it the work). Read-only actions run
# at once; changes wait for your y / n in the TUI; some things never run.
# [system]
# enabled = true
# shell = "bash"
# timeout_seconds = 60          # longest a command may run
# max_output = 20000            # characters of output handed back
# allow_commands = []           # prefixes that run without asking, e.g. ["cargo test", "make check"]
# write_roots = []              # folders files may be written in without asking, e.g. ["~/lyra-work"]
# deny_paths = ["~/.ssh", "~/.gnupg", "~/.lyra/config", "~/.aws", "~/.kube/config", "~/.docker/config.json", "~/.netrc", "/etc/shadow", "/etc/gshadow", "/etc/sudoers"]
# ssh_hosts = []                # servers ssh_run may use (~/.ssh/config names or user@host; keys only)
# http_timeout_seconds = 30
# approval_timeout_seconds = 300   # an unanswered approval counts as no

# Phones and browsers (see README): `lyra serve` runs lyra without the terminal
# UI and serves the web app. It speaks plain HTTP on `listen`; put a TLS reverse
# proxy (Zoraxy, Caddy, nginx) in front and open public_url on the phone. Pair a
# device with `lyra pair`.
# [web]
# listen = "127.0.0.1:8484"     # the proxy's upstream; use the LAN IP if the proxy runs elsewhere
# public_url = ""               # e.g. "https://lyra.example.com" (needed to install the app and for notifications)
# notify = true                 # push notifications when no device has lyra open

# Web search (see README): web_search asks a SearXNG instance (JSON format on),
# web_fetch reads a page as text. Both only read; replies cite their sources.
# [search]
# enabled = true
# searxng_url = "http://127.0.0.1:8080"
# max_results = 8
# fetch_max_chars = 20000

# Nightly backups of the lyra home (see README): lyra-<time>.tar.gz files.
# [backup]
# dir = ""              # default: next to the lyra home (~/.lyra-backups); a NAS mount is better
# at = "03:30"
# keep = 7
# include_uploads = false
# enabled = true

# Machine health (see README): every machine reports disks, memory, load, failed
# units and updates every 5 minutes; crossing a limit is logged and pushed once.
# [health]
# disk_percent = 90
# memory_percent = 95
# load_per_cpu = 2.0
# failed_units = true
# offline_minutes = 10
# notify = true

# Named sets of machines (see README): "update packages on @web" runs on each,
# with one approval. @all is the server and every online machine.
# [groups]
# web = ["web1", "web2"]

# Status (see README): everything lyra depends on, checked every minute by lyra
# serve; down twice in a row is pushed, and again when it's back.
# [status]
# every_seconds = 60
# notify = true
# mute = []

# Problems researched by themselves (see README): new machine problems and
# status checks that go down are looked into, read-only, by the Operator.
# [diagnose]
# auto = true
# enabled = true

# Coding agents (see README): coding work handed to OpenCode (simple) and Claude
# Code (complex, and taking over when OpenCode can't finish), full auto, never pushing.
# [coding]
# simple = "opencode"
# complex = "claude"
# fallback = "claude"
# timeout_minutes = 30
# allow_push = false

# The daily briefing (see README): what happened and what needs a look, pushed
# each morning by lyra serve.
# [briefing]
# schedule = "every day at 07:30"
# notify = true
# summary = true

# PMI, the project-management app (see README): tasks, reminders, projects.
# Its access token goes in config/secrets.toml with `lyra pmi token` or /pmi token.
# [pmi]
# url = "https://pmi.fbcad.org/api"
# org = ""            # an organization's slug; empty: the first one
# nag = true          # push again when a reminder went off and the task is still open
# nag_minutes = 30
# nag_max = 3
# enabled = true
