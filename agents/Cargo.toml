[package]
name = "lyra-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
lyra-capabilities = { version = "0.1.0", path = "../capabilities" }
lyra-memory = { version = "0.1.0", path = "../memory" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
serde_yaml_ng = "0.10"
toml = "1.1.6"
uuid = { version = "1.27.0", features = ["v4", "v5", "serde"] }
