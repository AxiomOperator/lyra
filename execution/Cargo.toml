[package]
name = "lyra-execution"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
