[package]
name = "lyra-capabilities"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "58"
arrow-schema = "58"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
lancedb = "=0.37.1"
lyra-memory = { version = "0.1.0", path = "../memory" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
