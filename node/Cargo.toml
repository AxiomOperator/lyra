[package]
name = "lyra-node"
version = "0.1.0"
edition = "2024"

# Small and self-contained (no LanceDB, no aws-lc): built static with musl, it
# runs on any x86_64 Linux. `lyra serve` hands it out at /download/lyra-node.
[[bin]]
name = "lyra-node"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
futures-util = "0.3"
lyra-system = { version = "0.1.0", path = "../system" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
