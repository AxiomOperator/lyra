[package]
name = "lyra-web"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
hkdf = "0.12"
include_dir = "0.7"
flate2 = "1.1.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
