<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="lyra">
<title>lyra</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="pair" class="screen hidden">
  <div class="pair-card">
    <img src="/icon-192.png" alt="" class="pair-logo">
    <h1>Pair this device</h1>
    <p>On the computer running lyra, run <code>lyra pair</code> and enter the code it shows.</p>
    <form id="pair-form">
      <input id="pair-code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="Pairing code" maxlength="12" required>
      <input id="pair-name" placeholder="Device name" maxlength="60">
      <button type="submit">Pair</button>
      <p id="pair-error" class="error"></p>
    </form>
  </div>
</div>

<div id="app" class="screen hidden">
  <header>
    <div class="title"><span class="dot" id="conn-dot"></span><span>lyra</span><span id="session-title" class="session-title"></span></div>
    <div id="phase" class="phase"></div>
    <button id="menu-button" class="icon-button" aria-label="Menu">⋯</button>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="chat" aria-live="polite"></main>
  <div id="approval" class="approval-card hidden"></div>
  <div id="palette" class="palette hidden"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message lyra…  ( / for commands )" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="Send">➤</button>
  </form>
</div>

<div id="menu" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head"><strong>lyra</strong><button class="icon-button" data-close>✕</button></div>
    <div id="menu-device" class="muted"></div>
    <div id="menu-machines" class="muted"></div>
    <button id="new-chat">New conversation</button>
    <button id="sessions-button">Saved conversations</button>
    <button id="notify-button">Turn on notifications</button>
    <button id="test-notify" class="hidden">Send a test notification</button>
    <p id="notify-note" class="muted"></p>
    <button id="unpair" class="danger">Unpair this device</button>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
