[package]
name = "lyra"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["agents","capabilities","node","system","web","evolution","execution","goals","learning","memory"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
lyra-agents = { version = "0.1.0", path = "agents" }
lyra-capabilities = { version = "0.1.0", path = "capabilities" }
lyra-evolution = { version = "0.1.0", path = "evolution" }
lyra-execution = { version = "0.1.0", path = "execution" }
lyra-goals = { version = "0.1.0", path = "goals" }
lyra-learning = { version = "0.1.0", path = "learning" }
lyra-node = { version = "0.1.0", path = "node" }
lyra-system = { version = "0.1.0", path = "system" }
lyra-web = { version = "0.1.0", path = "web" }
lyra-memory = { version = "0.1.0", path = "memory" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
signal-hook = "0.3.18"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
html2text = "0.17"
toml = "1.1.6"
toml_edit = "0.25.15"
qrcode = { version = "0.14.1", default-features = false }
tar = "0.4.46"
flate2 = "1.1.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
pdf-extract = "0.10"
lopdf = { version = "0.38", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
similar = { version = "2", features = ["text", "inline"] }

[profile.release]
strip = true
