[package]
name = "lyra"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["agents","capabilities","system","web","evolution","execution","goals","learning","memory"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
lyra-agents = { version = "0.1.0", path = "agents" }
lyra-capabilities = { version = "0.1.0", path = "capabilities" }
lyra-evolution = { version = "0.1.0", path = "evolution" }
lyra-execution = { version = "0.1.0", path = "execution" }
lyra-goals = { version = "0.1.0", path = "goals" }
lyra-learning = { version = "0.1.0", path = "learning" }
lyra-system = { version = "0.1.0", path = "system" }
lyra-web = { version = "0.1.0", path = "web" }
lyra-memory = { version = "0.1.0", path = "memory" }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
toml = "1.1.6"
